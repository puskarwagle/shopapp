name: Build Android APK

on:
  workflow_dispatch: # Manual trigger only — see README for how to run

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache native build intermediates
        uses: actions/cache@v5
        with:
          path: |
            android/app/.cxx
            android/app/build
            android/build
            android/.gradle
          key: ${{ runner.os }}-native-${{ hashFiles('**/build.gradle', '**/CMakeLists.txt', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --parallel

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: shopapp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
